<!DOCTYPE html>
<html>
<head>
  <title>Boat Party Scanner 🚤</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
    }

    h2 {
      margin-bottom: 10px;
    }

    #reader {
      width: 300px;
      margin: auto;
    }

    #status {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }

    .success { color: green; }
    .error { color: red; }
    .warning { color: orange; }
  </style>
</head>

<body>

<h2>🚤 Boat Party Check-In</h2>
<p>Scan guest QR ticket</p>

<div id="reader"></div>
<div id="status">Waiting to scan...</div>

<script>

const sheetUrl = "https://script.google.com/macros/s/AKfycbxn7u9ZGGnXLQak-tat4wN2hUm0DrZgeXrJI4hL32Cj_mn2vK_9EO4uHaxTFoGpUr1cjQ/exec";

// Prevent double scans
let lastScan = "";
let scanningEnabled = true;

// =======================
// HANDLE SCAN
// =======================
async function handleScan(decodedText) {

    if (!scanningEnabled || decodedText === lastScan) return;

    scanningEnabled = false;

    lastScan = decodedText;

    const statusEl = document.getElementById("status");
    statusEl.innerText = "Checking ticket...";
    statusEl.className = "";

    // -----------------------
    // Extract ticket safely
    // -----------------------
    let ticket = decodedText.trim();

    // If QR contains full URL → extract ticket param
    if (ticket.startsWith("http")) {
        try {
            const url = new URL(ticket);
            ticket = url.searchParams.get("ticket");
        } catch (e) {
            statusEl.innerText = "❌ Invalid QR format";
            statusEl.className = "error";
            scanningEnabled = true;
            return;
        }
    }

    if (!ticket) {
        statusEl.innerText = "❌ No ticket found";
        statusEl.className = "error";
        scanningEnabled = true;
        return;
    }

    // -----------------------
    // Call Apps Script backend
    // -----------------------
    fetch(sheetUrl + "?ticket=" + encodeURIComponent(ticket))
    .then(res => res.text())
    .then(data => {
        console.log(data);
        if (data.startsWith("CHECKED_IN")) {
            statusEl.innerText = "✅ " + data;
            statusEl.className = "success";
        } 
        else if (data === "ALREADY_CHECKED_IN") {
            statusEl.innerText = "⚠️ Ticket already used";
            statusEl.className = "warning";
        } 
        else {
            statusEl.innerText = "❌ Invalid ticket";
            statusEl.className = "error";
        }

      setTimeout(() => {
          scanningEnabled = true;
          statusEl.innerText = "Ready to scan next ticket...";
          statusEl.className = "";

        }, 1500);

    })
    .catch(err => {
        statusEl.innerText = "❌ Connection error: " + err.message;
        statusEl.className = "error";
        scanningEnabled = true;
    });
}

// =======================
// START CAMERA SAFELY
// =======================
const html5QrCode = new Html5Qrcode("reader");

Html5Qrcode.getCameras()
.then(devices => {
    if (devices && devices.length) {

        html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: 250 },
            handleScan
        ).catch(err => {
            document.getElementById("status").innerText =
                "Camera error: " + err;
        });

    } else {
        document.getElementById("status").innerText =
            "No camera found";
    }
})
.catch(err => {
    document.getElementById("status").innerText =
        "Camera permission error: " + err;
});

</script>

</body>
</html>
