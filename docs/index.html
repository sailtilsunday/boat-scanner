<!DOCTYPE html>
<html>

<head>
  <title>Boat Party Scanner 🚤</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
    }

    h2 {
      margin-bottom: 10px;
    }

    #reader {
      width: 300px;
      margin: auto;
    }

    #status {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }

    .warning {
      color: orange;
    }

  </style>

</head>


<body>


<h2>🚤 Boat Party Check-In</h2>

<p>Scan guest QR ticket</p>


<div id="reader"></div>

<div id="status">
  Waiting to scan...
</div>



<script>


const sheetUrl = "https://script.google.com/macros/s/AKfycbxn7u9ZGGnXLQak-tat4wN2hUm0DrZgeXrJI4hL32Cj_mn2vK_9EO4uHaxTFoGpUr1cjQ/exec";


// Scanner state
let scanningEnabled = true;
let lastScan = "";


// Create scanner
const html5QrCode = new Html5Qrcode("reader");



// =======================
// HANDLE QR SCAN
// =======================

async function handleScan(decodedText) {


  if (!scanningEnabled) {
    return;
  }


  scanningEnabled = false;


  const statusEl = document.getElementById("status");


  // Pause camera while checking
  try {
    await html5QrCode.pause(true);
  } catch(e) {
    console.log("Pause skipped");
  }



  statusEl.innerText = "🔍 Checking ticket...";
  statusEl.className = "";



  let ticket = decodedText.trim();



  // Extract ticket ID from QR URL
  if (ticket.startsWith("http")) {

    try {

      const url = new URL(ticket);

      ticket = url.searchParams.get("ticket");

    }

    catch(e) {

      statusEl.innerText = "❌ Invalid QR format";
      statusEl.className = "error";

      resetScanner();

      return;

    }

  }



  if (!ticket) {

    statusEl.innerText = "❌ No ticket found";
    statusEl.className = "error";

    resetScanner();

    return;

  }



  fetch(
    sheetUrl + "?ticket=" + encodeURIComponent(ticket)
  )

  .then(response => response.text())

  .then(data => {


    console.log("Backend response:", data);



    if (data.startsWith("CHECKED_IN")) {


      const name = data
        .replace("CHECKED_IN:", "")
        .trim();


      statusEl.innerText =
        "✅ " + name + " checked in";


      statusEl.className = "success";


    }


    else if (data === "ALREADY_CHECKED_IN") {


      statusEl.innerText =
        "⚠️ Ticket already used";


      statusEl.className = "warning";


    }


    else {


      statusEl.innerText =
        "❌ Invalid ticket";


      statusEl.className = "error";


    }



    setTimeout(() => {

      resetScanner();

    }, 500);



  })


  .catch(error => {


    statusEl.innerText =
      "❌ Connection error: " + error.message;


    statusEl.className = "error";


    resetScanner();


  });



}




// =======================
// RESET FOR NEXT SCAN
// =======================

function resetScanner() {


  try {

    html5QrCode.resume();

  }

  catch(e) {

    console.log("Resume skipped");

  }


  scanningEnabled = true;


  setTimeout(() => {

    document.getElementById("status").innerText =
      "Ready to scan next ticket...";


    document.getElementById("status").className = "";


  }, 300);


}




// =======================
// START CAMERA
// =======================


Html5Qrcode.getCameras()

.then(devices => {


  if (devices && devices.length) {


    html5QrCode.start(

      {
        facingMode: "environment"
      },

      {
        fps: 15,
        qrbox: {
          width: 300,
          height: 300
        }
      },

      handleScan

    );


  }


  else {


    document.getElementById("status").innerText =
      "No camera found";


  }


})


.catch(err => {


  document.getElementById("status").innerText =
    "Camera permission error: " + err;


});



</script>


</body>

</html>
