<!DOCTYPE html>
<html>
<head>
    <title>Boat Scanner</title>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        #reader {
            width: 300px;
            margin: 20px auto;
        }

        #status {
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
        }

        .ok { color: green; }
        .warn { color: orange; }
        .bad { color: red; }
    </style>
</head>

<body>

<h2>Boat Event Scanner</h2>

<div id="reader"></div>
<div id="status">Waiting for scan...</div>

<script>

////////////////////////////////////////////////////////////////////////////////
// 🔴 YOUR APPS SCRIPT URL (MUST BE CORRECT)
////////////////////////////////////////////////////////////////////////////////

const sheetUrl = "https://script.google.com/macros/s/AKfycbxcH0c1nzt6j6-4ZWZNlMPAMm8aWS4PrQhuqiBXO3cNZg2r5NPae-z_D0xyvJVATydEIw/exec"; 
// ⬆️ REPLACE THIS WITH YOUR REAL DEPLOYED URL

////////////////////////////////////////////////////////////////////////////////
// QR SCAN SUCCESS
////////////////////////////////////////////////////////////////////////////////

function onScanSuccess(decodedText) {

    document.getElementById("status").innerText = "Checking ticket...";

    const url = sheetUrl + "?ticket=" + encodeURIComponent(decodedText);

    console.log("OPENING URL:", url);

    // Open Apps Script as real browser request (bypasses CORS completely)
    const win = window.open(url, "_blank");

    if (!win) {
        document.getElementById("status").innerText =
            "❌ Popup blocked - check browser settings";
        return;
    }

    // Give it time to hit Apps Script, then close tab
    setTimeout(() => {
        try {
            win.close();
        } catch (e) {
            console.log("Could not auto-close tab:", e);
        }
    }, 800);

    document.getElementById("status").innerText =
        "✅ Ticket sent";
}

////////////////////////////////////////////////////////////////////////////////
// IGNORE SCAN FAILURES
////////////////////////////////////////////////////////////////////////////////

function onScanFailure(error) {
    // do nothing (normal while scanning)
}

////////////////////////////////////////////////////////////////////////////////
// START SCANNER
////////////////////////////////////////////////////////////////////////////////

const scanner = new Html5QrcodeScanner(
    "reader",
    {
        fps: 10,
        qrbox: 250
    }
);

scanner.render(onScanSuccess, onScanFailure);

////////////////////////////////////////////////////////////////////////////////

</script>

</body>
</html>
