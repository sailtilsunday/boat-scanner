<!DOCTYPE html>
<html>
  <body style="font-family: Arial; text-align:center; padding:30px;">
    
    <h2>QR Backend Test</h2>

    <button onclick="test()">Test Ticket Call</button>

    <p id="result">Waiting...</p>

    <script>
      function test() {
        const url = "https://script.google.com/macros/s/AKfycbxcH0c1nzt6j6-4ZWZNlMPAMm8aWS4PrQhuqiBXO3cNZg2r5NPae-z_D0xyvJVATydEIw/exec";

        fetch(url)
          .then(res => res.text())
          .then(data => {
            document.getElementById("result").innerText = data;
          })
          .catch(err => {
            document.getElementById("result").innerText = "ERROR: " + err.message;
          });
      }
    </script>

  </body>
</html>
